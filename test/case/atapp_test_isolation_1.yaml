# 集群隔离配置映射测试: metadata/bus.inherited_labels/bus.gateways -> atbus conf
atapp:
  id: 0x00000211
  id_mask: 8.8.8.8
  name: "isolation-test-node"
  type_id: 1
  type_name: "isolation-test"

  metadata:
    scope: "prod"
    namespace_name: "game"
    labels:
      zone: "cn-east"
      deployment.environment: "prod"
      not_inherited: "skip-me"

  bus:
    listen: "ipv4://127.0.0.1:21711"
    backlog: 256
    inherited_labels:
      - "zone"
      - "deployment.environment"
    gateways:
      - address: "ipv4://10.0.0.1:21711"
        match_scope: "prod"
        match_hosts:
          - "host-a"
          - "host-b"
        match_namespaces:
          - "game"
        match_labels:
          zone: "cn-east"
          not_inherited: "skip-me"
      - address: "ipv4://10.0.0.2:21711"
    first_idle_timeout: 3600s
    ping_interval: 3600s
    retry_interval: 3s
    fault_tolerant: 3
    message_size: 64KB
    receive_buffer_size: 1MB
    send_buffer_size: 1MB
    send_buffer_number: 0
  timer:
    tick_interval: 8ms
    stop_timeout: 3s
    stop_interval: 256ms
  etcd:
    enable: false

  log:
    level: debug
    category:
      - name: default
        prefix: "[Log %L][%F %T.%f][%s:%n(%C)]: "
        stacktrace:
          min: error
          max: fatal
        sink:
          - type: stdout
            level:
              min: fatal
              max: debug
